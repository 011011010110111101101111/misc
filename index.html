<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>418 I'm a teapot</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
      color: #222;
    }

    main {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 6rem;
      margin: 0;
    }

    h2 {
      margin: 0.5rem 0 1.5rem;
      font-weight: normal;
    }

    .teapot {
      font-size: 6rem;
      margin: 1rem;
    }

    p {
      color: #666;
    }

    code {
      background: #e8e8e8;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <main>
    <div class="teapot">🫖</div>

    <h1>418</h1>
    <h2>I'm a teapot</h2>

    <p>
      The requested entity is a teapot.<br>
      It cannot brew coffee.
    </p>

    <p>
      <code>HTTP/1.1 418 I'm a teapot</code>
    </p>
  </main>
</body>
</html>
